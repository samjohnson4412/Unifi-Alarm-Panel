<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm Panel — Cameras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="header-title" id="page-title">Loading&hellip;</span>
      </div>
    </div>
    <nav>
      <a href="/">Alerts</a>
      <a href="/bells.html">Bells</a>
      <a href="/cameras.html" class="active">Cameras</a>
      <a href="/status.html">Status</a>
      <a href="/settings.html" class="nav-right">&#9881; Settings</a>
    </nav>
  </div>

  <div class="page-content">

    <!-- Login -->
    <div id="login-section" style="display:none">
      <div class="card narrow">
        <h2>Staff Login</h2>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password"
            onkeydown="if(event.key==='Enter') login()">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="login()">Login</button>
        </div>
        <p id="login-error" class="error-text" style="display:none">Incorrect password &mdash; try again.</p>
      </div>
    </div>

    <!-- Main -->
    <div id="main-section" style="display:none">
      <main>
        <div class="refresh-toolbar">
          <button class="btn btn-secondary" onclick="loadCameras()">&#8635; Refresh All</button>
          <label style="text-transform:none;letter-spacing:0;font-size:0.84rem;color:var(--text-muted);display:flex;align-items:center;gap:8px">
            Auto-refresh:
            <select id="refresh-interval" onchange="setRefreshInterval()" style="width:auto">
              <option value="0">Off</option>
              <option value="10">10 s</option>
              <option value="30" selected>30 s</option>
              <option value="60">60 s</option>
            </select>
          </label>
          <span id="last-refresh" style="font-size:0.8rem;color:var(--text-muted);margin-left:auto"></span>
          <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
        </div>

        <div id="camera-grid" class="camera-grid">
          <p style="color:var(--text-muted)">Loading cameras&hellip;</p>
        </div>
      </main>
    </div>

  </div><!-- /.page-content -->

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script>
    let refreshTimer = null;
    let cameraList   = [];

    async function init() {
      const status = await apiFetch('/api/auth/user-status');
      if (status && status.authenticated) {
        showMain();
      } else {
        document.getElementById('login-section').style.display = '';
        setTimeout(() => document.getElementById('login-password').focus(), 50);
      }
    }

    async function login() {
      const password = document.getElementById('login-password').value;
      const data     = await apiFetch('/api/auth/user-login', 'POST', { password });
      if (data && data.ok) {
        document.getElementById('login-error').style.display   = 'none';
        document.getElementById('login-section').style.display = 'none';
        showMain();
      } else {
        document.getElementById('login-error').style.display = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    }

    async function logout() {
      await apiFetch('/api/auth/user-logout', 'POST');
      clearInterval(refreshTimer);
      document.getElementById('main-section').style.display   = 'none';
      document.getElementById('login-password').value         = '';
      document.getElementById('login-error').style.display    = 'none';
      document.getElementById('login-section').style.display  = '';
      document.getElementById('login-password').focus();
    }

    async function showMain() {
      const cfg = await apiFetch('/api/config/public');
      if (cfg) {
        document.title = `${cfg.schoolName} — Cameras`;
        document.getElementById('page-title').textContent = `${cfg.schoolName}`;
      }
      const saved = localStorage.getItem('cameraRefreshInterval');
      if (saved) document.getElementById('refresh-interval').value = saved;
      document.getElementById('main-section').style.display = '';
      loadCameras();
      setRefreshInterval();
    }

    async function loadCameras() {
      const data = await apiFetch('/api/cameras');
      if (!data || data.error) {
        document.getElementById('camera-grid').innerHTML =
          `<p class="error-text">${esc(data?.error || 'Failed to load cameras')}</p>`;
        return;
      }
      cameraList = Array.isArray(data) ? data : [];
      if (!cameraList.length) {
        document.getElementById('camera-grid').innerHTML =
          '<p style="color:var(--text-muted)">No cameras found on controller.</p>';
        return;
      }
      renderCameras();
      document.getElementById('last-refresh').textContent =
        'Updated: ' + new Date().toLocaleTimeString();
    }

    function renderCameras() {
      const grid = document.getElementById('camera-grid');

      const existingIds = [...grid.querySelectorAll('.camera-card[data-cam-id]')]
        .map(el => el.dataset.camId);
      const newIds = cameraList.map(c => c.id);
      const isRefresh = existingIds.length === newIds.length &&
        newIds.every((id, i) => id === existingIds[i]);

      if (!isRefresh) {
        grid.innerHTML = cameraList.map(cam => {
          const online = cam.state === 'CONNECTED';
          return `
            <div class="camera-card" data-cam-id="${cam.id}">
              <div class="camera-card-header">
                <span style="font-weight:600;font-size:0.9rem">${esc(cam.name)}</span>
                <span style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-muted)">
                  <span class="status-dot ${online ? 'online' : 'offline'}"></span>
                  ${online ? 'Online' : 'Offline'}
                </span>
              </div>
              <div class="camera-snapshot-wrap">
                ${online
                  ? `<img class="camera-snapshot" data-cam-id="${cam.id}"
                       alt="${esc(cam.name)}"
                       onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
                       onload="this.nextElementSibling.style.display='none'">
                     <div class="camera-snapshot-placeholder" style="display:flex">Loading&hellip;</div>`
                  : `<div class="camera-snapshot-placeholder">Camera offline</div>`
                }
              </div>
              <div class="camera-card-footer">
                <span>${esc(cam.type || cam.modelKey || '')}</span>
                ${cam.host ? `<span style="margin-left:auto;font-family:monospace">${esc(cam.host)}</span>` : ''}
              </div>
            </div>
          `;
        }).join('');

        grid.querySelectorAll('.camera-snapshot').forEach((img, i) => {
          setTimeout(() => { img.src = `/api/cameras/${img.dataset.camId}/snapshot`; }, i * 400);
        });

      } else {
        cameraList.forEach((cam, i) => {
          if (cam.state !== 'CONNECTED') return;
          const img = grid.querySelector(`.camera-snapshot[data-cam-id="${cam.id}"]`);
          if (!img || !img.src) return;
          const newSrc = `/api/cameras/${cam.id}/snapshot?ts=${Date.now()}`;
          setTimeout(() => {
            const loader = new Image();
            loader.onload = () => { img.src = newSrc; };
            loader.src = newSrc;
          }, i * 400);
        });
      }
    }

    function setRefreshInterval() {
      clearInterval(refreshTimer);
      const secs = parseInt(document.getElementById('refresh-interval').value);
      localStorage.setItem('cameraRefreshInterval', String(secs));
      if (secs > 0) {
        refreshTimer = setInterval(loadCameras, secs * 1000);
      }
    }

    async function apiFetch(url, method = 'GET', body) {
      try {
        const opts = { method, headers: {} };
        if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        const res = await fetch(url, opts);
        return res.json();
      } catch (err) {
        toast('Network error: ' + err.message, 'error');
        return null;
      }
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast${type ? ' ' + type : ''} show`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 4500);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>
</body>
</html>
