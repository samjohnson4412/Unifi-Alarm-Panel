<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="page-title">Loading&hellip;</h1>
    <p class="subtitle">Click a button to trigger the alarm.</p>
  </header>

  <nav>
    <a href="/" class="active">Alerts</a>
    <a href="/bells.html">Bells</a>
    <a href="/settings.html" class="nav-right">&#9881; Settings</a>
  </nav>

  <!-- ── Login ── -->
  <div id="login-section" style="display:none">
    <div class="card narrow">
      <h2>Staff Login</h2>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') login()">
      </div>
      <div class="form-actions">
        <button class="btn" onclick="login()">Login</button>
      </div>
      <p id="login-error" class="error-text" style="display:none">Incorrect password — try again.</p>
    </div>
  </div>

  <!-- ── Main content ── -->
  <div id="main-section" style="display:none">
    <main>
      <div class="toolbar">
        <button class="btn btn-secondary" id="check-btn" onclick="checkUnifi()">Check UniFi API</button>
        <span id="check-status" class="status-text">Waiting&hellip;</span>
        <button class="btn btn-secondary" style="margin-left:auto" onclick="logout()">Logout</button>
      </div>

      <div id="bells-suspended-banner" class="suspended-banner" style="display:none">
        &#9888; Bells are currently suspended
      </div>

      <div class="alarm-grid" id="alarm-grid">
        <!-- populated by JS -->
      </div>
    </main>

    <footer>V3.3 &mdash; Sam Johnson</footer>
  </div>

  <!-- ── Confirm modal (real alarms only) ── -->
  <div id="confirm-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">&#9888; WARNING</div>
      <p style="color:var(--text-muted);margin-bottom:8px">You are about to trigger:</p>
      <p id="modal-alarm-name" class="modal-alarm-name"></p>
      <p style="margin-top:12px">This is <strong>NOT a drill.</strong><br>Are you sure?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm-btn">YES &mdash; TRIGGER NOW</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script>
    async function init() {
      const status = await apiFetch('/api/auth/user-status');
      if (status && status.authenticated) {
        showMain();
      } else {
        document.getElementById('login-section').style.display = '';
        setTimeout(() => document.getElementById('login-password').focus(), 50);
      }
    }

    async function login() {
      const password = document.getElementById('login-password').value;
      const data     = await apiFetch('/api/auth/user-login', 'POST', { password });
      if (data && data.ok) {
        document.getElementById('login-error').style.display  = 'none';
        document.getElementById('login-section').style.display = 'none';
        showMain();
      } else {
        document.getElementById('login-error').style.display = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    }

    async function logout() {
      await apiFetch('/api/auth/user-logout', 'POST');
      document.getElementById('main-section').style.display  = 'none';
      document.getElementById('login-password').value        = '';
      document.getElementById('login-error').style.display   = 'none';
      document.getElementById('login-section').style.display = '';
      document.getElementById('login-password').focus();
    }

    async function showMain() {
      const data = await apiFetch('/api/config/public');
      if (!data) return;
      document.title = `${data.schoolName} — Alerts`;
      document.getElementById('page-title').textContent = `${data.schoolName} — Alerts`;

      const banner = document.getElementById('bells-suspended-banner');
      banner.style.display = data.bellsSuspended ? '' : 'none';

      renderAlarms(data.alarms);
      document.getElementById('main-section').style.display = '';
    }

    function renderAlarms(alarms) {
      document.getElementById('alarm-grid').innerHTML = alarms.map(a => `
        <button
          class="btn btn-alarm${a.isDrill ? '' : ' real'}"
          data-id="${a.id}"
          data-label="${esc(a.label)}"
          data-drill="${a.isDrill}"
          ${!a.configured ? 'title="Trigger ID not configured — visit Settings"' : ''}
        >${esc(a.label)}</button>
      `).join('');

      document.getElementById('alarm-grid').addEventListener('click', e => {
        const btn = e.target.closest('.btn-alarm');
        if (!btn) return;
        if (btn.dataset.drill === 'false') {
          showConfirm(btn.dataset.id, btn.dataset.label);
        } else {
          triggerAlarm(btn.dataset.id, btn);
        }
      });
    }

    // ── Confirm modal ──

    let pendingAlarmId = null;

    function showConfirm(id, label) {
      pendingAlarmId = id;
      document.getElementById('modal-alarm-name').textContent = label;
      document.getElementById('confirm-modal').style.display = '';
      document.getElementById('modal-confirm-btn').onclick = () => {
        closeModal();
        const btn = document.querySelector(`[data-id="${id}"]`);
        triggerAlarm(id, btn);
      };
    }

    function closeModal() {
      document.getElementById('confirm-modal').style.display = 'none';
      pendingAlarmId = null;
    }

    // ── Alarm trigger ──

    async function triggerAlarm(id, btn) {
      if (btn) { btn.disabled = true; }
      const orig = btn ? btn.textContent : '';
      if (btn) btn.textContent = 'Triggering…';
      try {
        const data = await apiFetch(`/api/alarm/${id}`, 'POST');
        if (data) {
          if (data.ok) toast(data.message, 'success');
          else toast(data.error || 'Failed', 'error');
        }
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = orig; }
      }
    }

    async function checkUnifi() {
      const btn    = document.getElementById('check-btn');
      const status = document.getElementById('check-status');
      btn.disabled = true;
      status.textContent = 'Checking…';
      status.className   = 'status-text';
      try {
        const data = await apiFetch('/api/check-unifi');
        if (data) {
          status.textContent = data.message;
          status.className   = `status-text ${data.ok ? 'ok' : 'error'}`;
        }
      } catch {
        status.textContent = 'Network error';
        status.className   = 'status-text error';
      } finally {
        btn.disabled = false;
      }
    }

    // ── Utilities ──

    async function apiFetch(url, method = 'GET', body) {
      try {
        const opts = { method, headers: {} };
        if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        const res = await fetch(url, opts);
        return res.json();
      } catch (err) {
        toast('Network error: ' + err.message, 'error');
        return null;
      }
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast${type ? ' ' + type : ''} show`;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 4500);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
